name: Quality
on:
  push:
    branches: [main, feature/chrome-sculpture]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: hashFiles('playwright.config.ts') != ''
      - run: npm run test:e2e
        if: hashFiles('playwright.config.ts') != ''
      - run: node scripts/ci-evidence.mjs
        if: hashFiles('playwright.config.ts') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
            docs/browser-evidence.json
          retention-days: 7
